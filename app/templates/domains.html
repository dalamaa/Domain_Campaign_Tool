{% extends 'base.html' %} {% block content %}
<div class="domain-management">
  <h2>Domains / Campaigns</h2>

  <div class="action-bar" id="domain-action-bar" style="display: block">
    <input
      type="text"
      placeholder="Search domains..."
      oninput="updateSearch(this.value)"
    />
    <span id="domain-count"></span>
    <button onclick="document.getElementById('csv-input').click()">
      Import CSV
    </button>
    <input
      type="file"
      id="csv-input"
      style="display: none"
      onchange="handleCSVImport(event)"
    />
    <button onclick="openModal()">+ Add Domain</button>
    <button id="edit-btn" onclick="editSelected()" disabled>Edit</button>
    <button id="delete-btn" onclick="bulkDeleteDomains()" disabled>
      Delete
    </button>
  </div>

  <div class="table-container" style="max-height: 600px; overflow-y: auto">
    <table id="domain-table">
      <thead>
        <tr>
          <th style="position: sticky; top: 0; background: #eee">Select</th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('domain')"
          >
            Domain ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('expiry')"
          >
            Expiry ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('expiry')"
          >
            Days Left ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('status')"
          >
            Status ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('price')"
          >
            Price ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('lastContact')"
          >
            Days Since ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('seq')"
          >
            Seq ↕
          </th>
          <th
            style="position: sticky; top: 0; background: #eee; cursor: pointer"
            onclick="sortTable('lastAction')"
          >
            Last Action ↕
          </th>
        </tr>
      </thead>
      <tbody id="domain-table-body">
        <!-- Rendered by JS -->
      </tbody>
    </table>
  </div>
</div>

<div
  id="domain-modal"
  class="modal"
  style="
    display: none;
    position: fixed;
    top: 20%;
    left: 30%;
    background: white;
    padding: 20px;
    border: 1px solid #ccc;
    z-index: 100;
  "
>
  <!-- 2. Update Modal Fields -->
  <h3 id="modal-title">Add/Edit Domain</h3>
  <input type="hidden" id="edit-id" />
  <label>Domain: <input type="text" id="form-domain" /></label><br />
  <label>Expiry Date: <input type="date" id="form-expiry" /></label><br />
  <label
    >Status:
    <select id="form-status">
      <option value="Active">Active</option>
      <option value="Resting">Resting</option>
      <option value="Sold">Sold</option>
      <option value="Expired">Expired</option>
      <option value="Archived">Archived</option>
    </select> </label
  ><br />
  <label>Price: <input type="number" id="form-price" /></label><br />
  <label>Last Contact Date: <input type="date" id="form-lastContact" /></label
  ><br />
  <label
    >Sequence:
    <select id="form-seq">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
    </select> </label
  ><br />
  <label
    >Last Action:
    <select id="form-lastAction">
      <option value="First Outreach">First Outreach</option>
      <option value="Follow-up">Follow-up</option>
      <option value="Price Reduction">Price Reduction</option>
      <option value="Question">Question</option>
      <option value="Final Follow-up">Final Follow-up</option>
      <option value="Other">Other</option>
    </select> </label
  ><br />
  <button onclick="saveDomain()">Save</button>
  <button onclick="closeModal()">Cancel</button>
</div>

<div
  id="side-panel"
  class="hidden"
  style="
    position: fixed;
    right: 0;
    top: 0;
    width: 300px;
    height: 100%;
    border-left: 1px solid #000;
    background: #fff;
    padding: 20px;
  "
>
  <button onclick="hideSidePanel()">Close</button>
  <div id="panel-content"></div>
</div>

<script src="{{ url_for('static', filename='js/shared.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/domains.js') }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", renderDomainTable);
</script>
{% endblock %}
