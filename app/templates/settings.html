{% extends 'base.html' %} {% block content %}
<div class="settings-management">
  <h2>Settings</h2>
  <div class="form-group" style="margin-top: 20px">
    <label>Business Timezone:</label><br />
    <select id="timezone-select" style="width: 300px; padding: 5px">
      <!-- Populated by JS -->
    </select>
    <button onclick="saveTimezone()">Save Timezone</button>
  </div>
  <div style="margin-top: 20px">
    <h3>First Follow-up</h3>
    <div id="first-view">
      <p>Current: <span id="first-display"></span></p>
      <button onclick="editSection('first')">Change</button>
    </div>
    <div id="first-edit" style="display: none">
      <label
        ><input
          type="radio"
          name="first-mode"
          value="fixed"
          onchange="toggleMode('first', 'fixed')"
        />
        Fixed day</label
      >
      <input type="number" id="first-fixed" style="width: 60px" /> days<br />
      <label
        ><input
          type="radio"
          name="first-mode"
          value="range"
          onchange="toggleMode('first', 'range')"
        />
        Range</label
      >
      From
      <input type="number" id="first-min" style="width: 60px" disabled /> To
      <input type="number" id="first-max" style="width: 60px" disabled />
      days<br />
      <button onclick="saveSection('first')">Save</button>
      <button onclick="cancelEdit('first')">Cancel</button>
    </div>
  </div>

  <div style="margin-top: 20px">
    <h3>Normal Follow-up</h3>
    <div id="normal-view">
      <p>Current: <span id="normal-display"></span></p>
      <button onclick="editSection('normal')">Change</button>
    </div>
    <div id="normal-edit" style="display: none">
      <label
        ><input
          type="radio"
          name="normal-mode"
          value="fixed"
          onchange="toggleMode('normal', 'fixed')"
        />
        Fixed day</label
      >
      <input type="number" id="normal-fixed" style="width: 60px" /> days<br />
      <label
        ><input
          type="radio"
          name="normal-mode"
          value="range"
          onchange="toggleMode('normal', 'range')"
        />
        Range</label
      >
      From
      <input type="number" id="normal-min" style="width: 60px" disabled /> To
      <input type="number" id="normal-max" style="width: 60px" disabled />
      days<br />
      <button onclick="saveSection('normal')">Save</button>
      <button onclick="cancelEdit('normal')">Cancel</button>
    </div>
  </div>

  <div style="margin-top: 20px">
    <h3>Reservation</h3>
    <div id="reservation-view">
      <p>Current: <span id="reservation-display"></span></p>
      <button onclick="editSection('reservation')">Change</button>
    </div>
    <div id="reservation-edit" style="display: none">
      <input type="number" id="daily-use-limit" style="width: 100px" />
      campaigns per email account per day<br />
      <button onclick="saveSection('reservation')">Save</button>
      <button onclick="cancelEdit('reservation')">Cancel</button>
    </div>
  </div>
</div>

<script>
  let timezoneTimer = null;
  let originalConfig = {};

  async function loadSettings() {
    const tzRes = await fetch("/api/settings/timezones");
    const timezones = await tzRes.json();
    const infoRes = await fetch("/api/settings/business-info");
    const data = await infoRes.json();
    const configRes = await fetch("/api/settings/follow-up-config");
    const config = await configRes.json();
    const limitRes = await fetch("/api/settings/daily-use-limit");
    const limitData = await limitRes.json();

    originalConfig = { config, limitData };

    const select = document.getElementById("timezone-select");
    timezones.forEach((tz) => {
      const option = document.createElement("option");
      option.value = tz.id;
      option.setAttribute("data-tz", tz.id);
      option.setAttribute("data-label", tz.label);
      option.textContent = tz.label;
      if (tz.id === data.business_timezone) {
        option.selected = true;
      }
      select.appendChild(option);
    });

    ["first", "normal"].forEach((type) => {
      const c = config[type];
      updateDisplay(type, c);
    });

    document.getElementById("reservation-display").textContent =
      `${limitData.limit} campaigns per email account per day`;
    updateTimezoneTimes();
    scheduleNextTimezoneUpdate();
  }

  function toggleMode(type, mode) {
    const isFixed = mode === "fixed";
    document.getElementById(`${type}-fixed`).disabled = !isFixed;
    document.getElementById(`${type}-min`).disabled = isFixed;
    document.getElementById(`${type}-max`).disabled = isFixed;
  }

  function updateTimezoneTimes() {
    const select = document.getElementById("timezone-select");
    const options = select.querySelectorAll("option");
    const now = new Date();

    options.forEach((option) => {
      const tz = option.getAttribute("data-tz");
      const baseLabel = option.getAttribute("data-label");
      if (!tz) return;

      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: tz,
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
        const timeString = formatter.format(now);
        const newText = `${baseLabel} (${timeString})`;

        if (option.textContent !== newText) {
          option.textContent = newText;
        }
      } catch (e) {
        // fallback
      }
    });
  }

  function scheduleNextTimezoneUpdate() {
    const now = new Date();
    const delay = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

    if (timezoneTimer) clearTimeout(timezoneTimer);

    timezoneTimer = setTimeout(() => {
      updateTimezoneTimes();
      scheduleNextTimezoneUpdate();
    }, delay);
  }

  function updateDisplay(type, c) {
    const display = document.getElementById(`${type}-display`);
    if (c.mode === "fixed") {
      display.textContent = `Fixed day · ${c.min} days`;
    } else {
      display.textContent = `Range · ${c.min} to ${c.max} days`;
    }
  }

  function editSection(type) {
    document.getElementById(`${type}-view`).style.display = "none";
    document.getElementById(`${type}-edit`).style.display = "block";

    if (type !== "reservation") {
      const c = originalConfig.config[type];
      document.querySelector(
        `input[name="${type}-mode"][value="${c.mode}"]`,
      ).checked = true;
      toggleMode(type, c.mode);
      if (c.mode === "fixed") {
        document.getElementById(`${type}-fixed`).value = c.min;
      } else {
        document.getElementById(`${type}-min`).value = c.min;
        document.getElementById(`${type}-max`).value = c.max;
      }
    } else {
      document.getElementById("daily-use-limit").value =
        originalConfig.limitData.limit;
    }
  }

  function cancelEdit(type) {
    document.getElementById(`${type}-view`).style.display = "block";
    document.getElementById(`${type}-edit`).style.display = "none";
  }

  async function saveSection(type) {
    if (type === "reservation") {
      const limit = document.getElementById("daily-use-limit").value;
      const res = await fetch("/api/settings/daily-use-limit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ limit }),
      });
      if (res.ok) {
        originalConfig.limitData.limit = limit;
        document.getElementById("reservation-display").textContent =
          `${limit} campaigns per email account per day`;
        cancelEdit(type);
      } else {
        alert("Error saving reservation limit.");
      }
    } else {
      const data = { [type]: getModeData(type) };
      const res = await fetch("/api/settings/follow-up-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        originalConfig.config[type] = data[type];
        updateDisplay(type, data[type]);
        cancelEdit(type);
      } else {
        alert("Error saving follow-up settings.");
      }
    }
  }

  async function saveTimezone() {
    const timezone = document.getElementById("timezone-select").value;
    const res = await fetch("/api/settings/business-timezone", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ timezone }),
    });
    if (res.ok) alert("Timezone saved.");
    else alert("Error saving timezone.");
  }

  function getModeData(type) {
    const mode = document.querySelector(
      `input[name="${type}-mode"]:checked`,
    ).value;
    if (mode === "fixed") {
      const val = document.getElementById(`${type}-fixed`).value;
      return { mode, min: val, max: val, fixed: val };
    }
    return {
      mode,
      min: document.getElementById(`${type}-min`).value,
      max: document.getElementById(`${type}-max`).value,
    };
  }

  document.addEventListener("DOMContentLoaded", loadSettings);
  window.addEventListener("beforeunload", () => {
    if (timezoneTimer) clearTimeout(timezoneTimer);
  });
</script>
{% endblock %}
