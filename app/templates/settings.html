{% extends 'base.html' %} {% block content %}
<div class="settings-management">
  <h2>Settings</h2>
  <div class="form-group" style="margin-top: 20px">
    <label>Business Timezone:</label><br />
    <select id="timezone-select" style="width: 300px; padding: 5px">
      <!-- Populated by JS -->
    </select>
  </div>
  <div style="margin-top: 20px">
    <h3>First Follow-up</h3>
    <label
      ><input
        type="radio"
        name="first-mode"
        value="fixed"
        checked
        onchange="toggleMode('first', 'fixed')"
      />
      Fixed day</label
    >
    <input type="number" id="first-fixed" style="width: 60px" /> days<br />
    <label
      ><input
        type="radio"
        name="first-mode"
        value="range"
        onchange="toggleMode('first', 'range')"
      />
      Range</label
    >
    From <input type="number" id="first-min" style="width: 60px" disabled /> To
    <input type="number" id="first-max" style="width: 60px" disabled /> days
  </div>

  <div style="margin-top: 20px">
    <h3>Normal Follow-up</h3>
    <label
      ><input
        type="radio"
        name="normal-mode"
        value="fixed"
        checked
        onchange="toggleMode('normal', 'fixed')"
      />
      Fixed day</label
    >
    <input type="number" id="normal-fixed" style="width: 60px" /> days<br />
    <label
      ><input
        type="radio"
        name="normal-mode"
        value="range"
        onchange="toggleMode('normal', 'range')"
      />
      Range</label
    >
    From <input type="number" id="normal-min" style="width: 60px" disabled /> To
    <input type="number" id="normal-max" style="width: 60px" disabled /> days
  </div>

  <div style="margin-top: 20px">
    <h3>Reservation</h3>
    <label for="daily-use-limit">Email Account Daily Reservation Limit:</label
    ><br />
    <input type="number" id="daily-use-limit" style="width: 100px" /> campaigns
    per email account per day
  </div>

  <div style="margin-top: 20px">
    <button onclick="saveSettings()" style="padding: 8px 16px">
      Save Settings
    </button>
  </div>
</div>

<script>
  let timezoneTimer = null;

  async function loadSettings() {
    const tzRes = await fetch("/api/settings/timezones");
    const timezones = await tzRes.json();
    const infoRes = await fetch("/api/settings/business-info");
    const data = await infoRes.json();
    const configRes = await fetch("/api/settings/follow-up-config");
    const config = await configRes.json();
    const limitRes = await fetch("/api/settings/daily-use-limit");
    const limitData = await limitRes.json();

    const select = document.getElementById("timezone-select");
    timezones.forEach((tz) => {
      const option = document.createElement("option");
      option.value = tz.id;
      option.setAttribute("data-tz", tz.id);
      option.setAttribute("data-label", tz.label);
      option.textContent = tz.label;
      if (tz.id === data.business_timezone) {
        option.selected = true;
      }
      select.appendChild(option);
    });

    ["first", "normal"].forEach((type) => {
      const c = config[type];
      document.querySelector(
        `input[name="${type}-mode"][value="${c.mode}"]`,
      ).checked = true;
      toggleMode(type, c.mode);
      if (c.mode === "fixed") {
        document.getElementById(`${type}-fixed`).value = c.min;
      } else {
        document.getElementById(`${type}-min`).value = c.min;
        document.getElementById(`${type}-max`).value = c.max;
      }
    });

    document.getElementById("daily-use-limit").value = limitData.limit;

    updateTimezoneTimes();
    scheduleNextTimezoneUpdate();
  }

  function toggleMode(type, mode) {
    const isFixed = mode === "fixed";
    document.getElementById(`${type}-fixed`).disabled = !isFixed;
    document.getElementById(`${type}-min`).disabled = isFixed;
    document.getElementById(`${type}-max`).disabled = isFixed;
  }

  function updateTimezoneTimes() {
    const select = document.getElementById("timezone-select");
    const options = select.querySelectorAll("option");
    const now = new Date();

    options.forEach((option) => {
      const tz = option.getAttribute("data-tz");
      const baseLabel = option.getAttribute("data-label");
      if (!tz) return;

      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: tz,
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
        const timeString = formatter.format(now);
        const newText = `${baseLabel} (${timeString})`;

        if (option.textContent !== newText) {
          option.textContent = newText;
        }
      } catch (e) {
        // fallback
      }
    });
  }

  function scheduleNextTimezoneUpdate() {
    const now = new Date();
    const delay = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

    if (timezoneTimer) clearTimeout(timezoneTimer);

    timezoneTimer = setTimeout(() => {
      updateTimezoneTimes();
      scheduleNextTimezoneUpdate();
    }, delay);
  }

  async function saveSettings() {
    const data = {
      first: getModeData("first"),
      normal: getModeData("normal"),
    };

    const tzRes = await fetch("/api/settings/business-timezone", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        timezone: document.getElementById("timezone-select").value,
      }),
    });

    const confRes = await fetch("/api/settings/follow-up-config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });

    const limitRes = await fetch("/api/settings/daily-use-limit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        limit: document.getElementById("daily-use-limit").value,
      }),
    });
    if (tzRes.ok && confRes.ok && limitRes.ok) {
      alert("Settings saved successfully.");
      location.reload();
    } else {
      alert("Error saving settings.");
    }
  }

  function getModeData(type) {
    const mode = document.querySelector(
      `input[name="${type}-mode"]:checked`,
    ).value;
    if (mode === "fixed") {
      const val = document.getElementById(`${type}-fixed`).value;
      return { mode, min: val, max: val, fixed: val };
    }
    return {
      mode,
      min: document.getElementById(`${type}-min`).value,
      max: document.getElementById(`${type}-max`).value,
    };
  }

  document.addEventListener("DOMContentLoaded", loadSettings);
  window.addEventListener("beforeunload", () => {
    if (timezoneTimer) clearTimeout(timezoneTimer);
  });
</script>
{% endblock %}
