{% extends 'base.html' %} {% block content %}
<div class="email-management">
  <h2>Email Accounts Management</h2>
  <div class="action-bar" id="action-bar" style="display: block">
    <button id="move-up-btn" onclick="bulkMove(-1)" disabled>Move Up</button>
    <button id="move-down-btn" onclick="bulkMove(1)" disabled>Move Down</button>
    <button id="edit-btn" onclick="bulkToggle()" disabled>
      Enable/Disable
    </button>
    <button id="delete-btn" onclick="bulkDelete()" disabled>Delete</button>
  </div>
  <div class="table-container">
    <table id="email-table">
      <thead>
        <tr>
          <th>Select</th>
          <th>⋮⋮</th>
          <th>Code</th>
          <th>Group</th>
          <th>Order</th>
          <th>Status</th>
          <th>Reserved By</th>
        </tr>
      </thead>
      <tbody id="email-table-body">
        <!-- Rendered by JS -->
      </tbody>
    </table>
  </div>
</div>

<script src="{{ url_for('static', filename='js/shared.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/email_accounts.js') }}"></script>
{% endblock %}
